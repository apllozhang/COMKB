  let q = "", course = "", sortKey = "title", sortDir = 1, page = 1, pageSize = 50;
  const $ = (s) => document.querySelector(s);
  const tbody = $("#tbody"), empty = $("#empty"), countEl = $("#count"), rangeEl = $("#range");

  function filtered() {
    const k = q.trim().toLowerCase();
    let rows = DATA.filter(r => {
      if (course && r.label !== course) return false;
      if (!k) return true;
      return (r.title + " " + r.sig + " " + r.sid + " " + r.label + " " + r.course).toLowerCase().includes(k);
    });
    rows.sort((a, b) => String(a[sortKey]||"").localeCompare(String(b[sortKey]||""), "zh") * sortDir);
    return rows;
  }

  function render() {
    const rows = filtered();
    const total = rows.length;
    const pages = Math.max(1, Math.ceil(total / pageSize));
    if (page > pages) page = pages;
    const start = (page - 1) * pageSize;
    const slice = rows.slice(start, start + pageSize);
    countEl.textContent = "记录 " + total + " 条";
    rangeEl.textContent = total ? ("第 " + (start + 1) + "–" + Math.min(start + pageSize, total) + " 条 / 共 " + total) : "";
    tbody.innerHTML = slice.map(r =>
      '<tr>'
      + '<td><a href="' + r.href + '">' + r.title + '</a></td>'
      + '<td style="text-align:left">' + r.sig + '</td>'
      + '<td>' + r.label + '</td>'
      + '<td><code style="font-size:12px">' + r.sid + '</code></td>'
      + '</tr>'
    ).join("");
    empty.hidden = total > 0;
    document.getElementById("tbl").style.display = total ? "" : "none";
    // pagination window
    const pg = document.getElementById("pages");
    pg.innerHTML = "";
    const span = 5;
    let a = Math.max(1, page - 2), b = Math.min(pages, a + span - 1);
    a = Math.max(1, b - span + 1);
    for (let i = a; i <= b; i++) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "pg-btn";
      btn.textContent = i;
      btn.setAttribute("aria-current", i === page ? "true" : "false");
      btn.addEventListener("click", () => { page = i; render(); });
      pg.appendChild(btn);
    }
    $("#prev").disabled = page <= 1;
    $("#next").disabled = page >= pages;
  }

  // search debounce 300ms
  let t = null;
  const qEl = $("#q"), box = $("#searchBox");
  qEl.addEventListener("input", () => {
    box.classList.toggle("has-value", !!qEl.value);
    clearTimeout(t);
    t = setTimeout(() => { q = qEl.value; page = 1; render(); }, 300);
  });
  function clearSearch() { qEl.value = ""; q = ""; box.classList.remove("has-value"); page = 1; render(); qEl.focus(); }
  $("#qClear").addEventListener("click", clearSearch);
  $("#emptyClear").addEventListener("click", () => { clearSearch(); course = ""; document.querySelectorAll("#filters .chip").forEach(c => c.setAttribute("aria-pressed", c.dataset.course === "" ? "true" : "false")); render(); });

  // course filter
  $("#filters").addEventListener("click", (e) => {
    const b = e.target.closest(".chip");
    if (!b) return;
    course = b.dataset.course || "";
    page = 1;
    document.querySelectorAll("#filters .chip").forEach(c => c.setAttribute("aria-pressed", c === b ? "true" : "false"));
    render();
  });

  // sort
  document.querySelectorAll("th.sortable").forEach(th => {
    th.addEventListener("click", (e) => {
      if (e.target.closest(".col-resizer")) return;
      const key = th.dataset.key;
      if (sortKey === key) sortDir = -sortDir;
      else { sortKey = key; sortDir = 1; }
      document.querySelectorAll("th.sortable").forEach(x => x.setAttribute("aria-sort", "none"));
      th.setAttribute("aria-sort", sortDir === 1 ? "ascending" : "descending");
      page = 1;
      render();
    });
  });

  // column resize (drag + keyboard)
  document.querySelectorAll(".col-resizer").forEach((el) => {
    const th = el.parentElement;
    let startX = 0, startW = 0, active = false;
    const setW = (px) => {
      th.style.width = Math.max(80, px) + "px";
    };
    el.addEventListener("pointerdown", (e) => {
      active = true;
      el.classList.add("active");
      el.setPointerCapture(e.pointerId);
      startX = e.clientX;
      startW = th.getBoundingClientRect().width;
      e.preventDefault();
    });
    el.addEventListener("pointermove", (e) => {
      if (!active) return;
      setW(startW + (e.clientX - startX));
    });
    el.addEventListener("pointerup", (e) => {
      active = false;
      el.classList.remove("active");
      try { el.releasePointerCapture(e.pointerId); } catch (_) {}
    });
    el.addEventListener("keydown", (e) => {
      const step = e.shiftKey ? 24 : 8;
      const w = th.getBoundingClientRect().width;
      if (e.key === "ArrowLeft") { setW(w - step); e.preventDefault(); }
      if (e.key === "ArrowRight") { setW(w + step); e.preventDefault(); }
    });
  });

  $("#prev").addEventListener("click", () => { if (page > 1) { page--; render(); } });
  $("#next").addEventListener("click", () => { page++; render(); });
  $("#pageSize").addEventListener("change", (e) => { pageSize = +e.target.value; page = 1; render(); });

  render();

    if(!layout) return;
    layout.classList.toggle('sidebar-collapsed', !!on);
    try{ localStorage.setItem(KEY, on ? '1' : '0'); }catch(e){}
    var dock = document.getElementById('sidebar-dock');
    var rail = document.getElementById('sidebar-rail');
    var old = document.getElementById('sidebar-toggle');
    if (dock) {
      dock.innerHTML = on
        ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg> 展开'
        : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg> 收起目录';
      dock.setAttribute('aria-label', on ? '展开课程目录' : '收起课程目录');
    }
    if (old) old.hidden = true;
    if (rail) rail.hidden = !on;
  }
  var saved = null;
  try{ saved = localStorage.getItem(KEY); }catch(e){}
  if (layout) {
    var w = null;
    try{ w = localStorage.getItem(WKEY); }catch(e){}
    if (w) {
      var n = parseInt(w, 10);
      if (n >= 220 && n <= 480) layout.style.setProperty('--sidebar-w', n + 'px');
    }
    applyCollapsed(saved === '1');
  }
  var dock = document.getElementById('sidebar-dock');
  var rail = document.getElementById('sidebar-rail');
  if (dock) dock.addEventListener('click', function(){
    applyCollapsed(!layout.classList.contains('sidebar-collapsed'));
  });
  if (rail) rail.addEventListener('click', function(){ applyCollapsed(false); });

  var rz = document.getElementById('sidebar-resizer');
  if (rz && layout) {
    var dragging = false, startX = 0, startW = 300;
    function setW(px){
      px = Math.max(220, Math.min(480, px));
      layout.style.setProperty('--sidebar-w', px + 'px');
      try{ localStorage.setItem(WKEY, String(px)); }catch(e){}
    }
    rz.addEventListener('pointerdown', function(e){
      dragging = true;
      rz.classList.add('active');
      rz.setPointerCapture(e.pointerId);
      startX = e.clientX;
      startW = layout.getBoundingClientRect().width ? parseInt(getComputedStyle(layout).getPropertyValue('--sidebar-w') || '300', 10) : 300;
      e.preventDefault();
    });
    rz.addEventListener('pointermove', function(e){
      if (!dragging) return;
      setW(startW + (e.clientX - startX));
    });
    rz.addEventListener('pointerup', function(e){
      dragging = false;
      rz.classList.remove('active');
      try{ rz.releasePointerCapture(e.pointerId); } catch(_){}
    });
    rz.addEventListener('keydown', function(e){
      var cur = parseInt(getComputedStyle(layout).getPropertyValue('--sidebar-w') || '300', 10);
      var step = e.shiftKey ? 24 : 8;
      if (e.key === 'ArrowLeft') { setW(cur - step); e.preventDefault(); }
      if (e.key === 'ArrowRight') { setW(cur + step); e.preventDefault(); }
    });
  }

  var back = document.getElementById('btn-back');
  if (back) back.addEventListener('click', function(e){
    e.preventDefault();
    if (history.length > 1) history.back();
    else location.href = back.getAttribute('data-fallback') || '/index.html';
  });
})();
</script>
</body>
</html>
