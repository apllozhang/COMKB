entry:
  name: oxo-connect-advanced
  description: 'OXO Connect（R6.3）进阶组网与垂直方案交付：公网/私网 SIP 组网与注册排障、ARS 路由套件（三表协作/多运营商/Internal ARS）、酒店与计费垂直方案、
    系统安全加固、证书与加密传输（DTLS/TLS-SRTP）、语音导航（AA/MLAA/SCR）、语音邮箱与移动办公、Cloud Connect 舰队与远程维护。适用于已掌握 OXO 基础的交付/售后
    工程师的进阶配置、选型、排障与方案落地问答；OMC 安装与云侧入门属 bundle.oxo-connect-starter，生产化数值与方案方法论不在原书范围（见 out_of_scope）。

    '
  core_principles:
  - 双工具贯穿全书：OMC 管配置对象树，Webdiag 管调试/证书/抓包；几乎所有 How-To 都以"行为验证"收口（History Table 消息、显示字符、LED、小票文件）
  - 组网三件套：编号计划触发、ARS 表匹配变换、中继组列表按序选路；Media 带宽最少 5 通话是公网与私网网关共同的外呼放行闸门
  - 垂直与增强按 license 分层：酒店/OHL、Call Accounting、安全加固、DTLS、TLS/SRTP、Cloud Connect 免 license；AA 定制、MLAA 树数、SCR、Hot Desking、IP-DECT 用户、多实体 MoH 需 license
  - 安全基线五支柱：强制改默认密码 + AutoPwdChk 自动检查 + Network IP Services 网络面收敛 + VMU 锁定翻倍（封顶 1440 分钟）+ 加固清单；总纲 TC1143
  - 实验环境口径：教材全部 IP/密码/账号/号码为 RLAB 教学值；生产必须替换并按 TC1143/TC1398/Global Limits 等书外权威文档校准
  out_of_scope:
  - 生产运营商互联参数、eBuy license 资料、国家 DECT 频段许可等"讲师给值"位（原书全部为实验口径）
  - 方案设计方法论：ARS 前缀规划、MLAA 菜单设计、DECT 布点勘测方法（SSK 手册 8AL90874USAA）、license 规划——书内只给机制与上限
  - OMC 安装入门、Rainbow 云侧公司/订阅/成员体系（属 bundle.oxo-connect-starter）；OXE 平台详节
  - 外部计费应用入账、企业 PKI 审批流、Teams/Rainbow 租户策略、ACD 呼叫中心完整运营
  stop_conditions:
  - 涉及生产取值（运营商参数/端口带宽/ARI/密码策略）→ 明确指向书外权威来源（运营商合同/TC 文档/Global Limits），不以实验口径搪塞
  - 用户数、公司数、树数等超出书内容量上限（4 实体、5 MLAA 树、10000 SCR 规则、80 xBS 等）→ 声明上限并转其它产品线或架构方案
  - 版本敏感判定（4K 证书回滚、8214 兼容、8158s NOE 模式）→ 按书内注记如实说明并要求核对最新 TC
  - 原书内部矛盾（Internal ARS 时段 nr-01、DHCP 池 nr-02、门户域名 nr-05）→ 双口径如实呈现，不给虚假唯一答案
router_entry:
  name: oxo-connect-advanced-router
  description: 'OXO Connect 进阶能力路由入口：按用户意图分发到 14 张能力卡——SIP 组网、ARS 路由套件、酒店计费垂直、安全加固、证书加密、语音导航、语音邮箱与移动、
    Cloud Connect 舰队八个 promoted 能力，以及交付地基、终端生态、共享终端、多实体、DECT 无线、维护工具箱六张 router 能力卡。

    '
