  baseline_tag: OXE R10.16 / CCS 10.5 时代 / RLAB 实验环境 / 法国目标库
entry:
  name: otcc-standard-starter
  description: 'OXE 内置呼叫中心（OTCC Standard/CCD）的入门级交付闭环：CCD 五级矩阵（pilot/队列/处理组）、CCS 班长台安装、路由与分配规则、座席班长体系、
    对象参数调优、语音指南三路径、实时监控与 Excel 统计、多语言与双日历；另含班长特性、排队体验（EWT/518）、直接呼叫与紧急关闭、统计 pilot、实验环境链路五张路由卡。
    适用于单站点入门交付、配置、排障与行为口径问答；话务建模、CCIVR/ACR/CCA、多站点等进阶域不在原书范围（见 out_of_scope）。

    '
  core_principles:
  - 五级矩阵：一切呼叫流服从 pilot → 路由 → 队列 → 分配 → 处理组；配置的本质是连方向、定优先级、给默认行为
  - 默认全关：分配规则默认停用（须 OXE 侧激活）、所有方向默认关闭、末座席退出可禁——"配好了不通"先查激活与方向
  - 优先级统一 0-9（0 最高 9 最低），平局规则三类各异：路由看 EWT、资源选择看 LIT、呼叫选择看真实等待时间
  - 双控制台分工：OXE Web Admin 建 CCD 底层对象，CCS 管规则/座席/实时/统计/紧急关闭；CCS 无权创建 CCD 对象（只能建班长与分配规则）
  - 座席状态时序是排障共同语言：wrap-up 自动挂 pilot、手动挂 PG；pause 可接私人电话；退出 9 类型供统计；Blocked 是"下游无资源"的自动态
  - 实验口径红线：教材密码/号码/前缀/板位为 RLAB 实验值（法国目标库），生产必须替换并按当版文档核对
  out_of_scope:
  - CCIVR 外部语音服务器、ACR 高级路由（语言技能/呼叫档案）、CCA 座席桌面、Soft Panel、ALE Connect 全渠道（原书只点名，指向 OTCC901 进阶教材）
  - 话务建模与容量规划方法（TSP 调参只有"逐步调整+观察告警"口径，无话务量→队列数→座席数规划）
  - 多站点 Multisite CCS、Excel 宏（ACDMacro）、录音第四法（Audio Station/VGTransfer 工具链）
  - 生产中继申请、编号计划与 COS 体系设计（原书假设 RLAB 预置库现成）
  - Rainbow 平台与 WebRTC 网关部署（本书 Rainbow 仅作座席形态，只有架构图无落地步骤）
  stop_conditions:
  - 用户问 CCIVR/ACR/CCA/Soft Panel/ALE Connect 细节 → 声明书外边界，指向 OTCC901 与 Feature list，不以本包内容猜测
  - 用户要话务量→队列数→座席数的规划方法 → 给 EWT/TSP 公式口径但明确声明建模在书外
  - 生产环境拟套用教材密码/号码/前缀 → 判停并要求替换（实验口径红线）
  - 现场界面与 R10.16/CCS 10.5 时代不符 → 按当版 OXE/CCS 文档核对，不凭本包记忆操作
  - 需要 Multisite 多站点 CCS 或 Excel 宏自动化 → 边界外，指向 OTCC901
router_entry:
  name: otcc-standard-starter-router
  description: 'OTCC Standard 入门能力路由入口：按用户意图分发到 13 张能力卡——矩阵地基、CCS 安装、路由与分配规则、座席班长体系、对象调优、语音指南、监控统计、
    多语言日历八个 promoted 能力，以及班长特性（监听强插/通用转发/事务码）、排队体验（EWT/518）、直接呼叫与紧急关闭、统计 pilot、实验环境链路五张 router 能力卡。

    '
