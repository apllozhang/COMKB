schema_version: 1
bundle_id: bundle.oxo-connect-starter
book:
  title: OXO Connect Starter (Participant's Guide, Edition 16)
  author: ALE Training Services
  source_pack: OXOCXTE300EN.pdf (472 pages)
  baseline_tag: OXO Connect R6.3 / OpenTouch Suite for SMB / RLAB
entry:
  name: oxo-connect-starter
  description: 'OXO Connect（OCE IPBox 与 PowerCPU EE 平台）从开箱到投产的端到端交付：交付前数据采集、FTR 上云与 OMC Standard 双路线开通、IP 规划、终端开通（IP 话机/DECT）、编号计划与组、用户功能与语音信箱、公共 SIP 中继、呼入分发与呼出闭锁、备份升级复位、安全基线，以及 Rainbow 混合云接入速览。
    适用于 OXO 本体交付的配置、排障与方案问答；Rainbow 云侧运营深入内容与 OXO ACD 呼叫中心不在本 bundle（见 out_of_scope 与姊妹技能）。

    '
  core_principles:
  - 交付从数据采集开始：IP 规划、七账户密码表、三位编号计划（100-199/主中继组 0/hunt 500-525/DDI 41100-41199）先定稿后动配置
  - 开通两条路：Cloud Connect（FTR 自动注册、许可自动下载、Fleet Dashboard）与 Standard（OMC 连 192.168.92.246、导入 .msl+.csl 双钥匙）；pbxk1064 仅首连一次
  - 出局控制是矩阵不是清单：Traffic sharing 与 Barring 两类链路类别 × 6 张闭锁表 × digit counter，用户 COS × 中继组 COS 求交判定
  - 呼入靠话务台组+时段表+Normal/Restricted 双 DDI 计划；组恒并行；用户默认不跟随时段，要逐话机关 Inhibition Time-ranges
  - 维护三板斧语义分明：备份（OCE SD 卡 AES 256、恢复仅同主版本）、双版本+Swap 可回退、Warm/Cold/Factory 递进删除
  - 实验环境口径：教材全部密码、账号、网段仅限实验；生产化依据外置 TC1143/TC1284/TC1994/TC2479/cookbook 五份文档
  out_of_scope:
  - Rainbow 云侧公司/订阅/成员运营、OCE-FE 多场景开局、Teams 集成、SR 支持体系（bundle.rainbow-oxo-connect 承载，本 bundle 仅速览）
  - OXO ACD 呼叫中心排队坐席体系（bundle.oxo-connect-call-center 承载）
  - 生产 SIP 运营商选型与加密要求（TC1284）、安全加固全文（TC1143）、TURN 与防火墙白名单（cookbook）
  - RLAB 实验环境与 ITSP1 模拟器搭建（教学基础设施，仅 Boundary 背景）
  stop_conditions:
  - 用户数超 300 或需机柜扩展以外的平台能力 → 超出 OXO 产品定位，转其他产品线方案
  - 需要生产网络数值、TC 全文或 cookbook 操作步骤 → 明确指向外部权威文档，不以实验口径搪塞
  - 涉及 Rainbow 云侧深度运营或 ACD 排队业务 → 转对应姊妹技能，不越界作答
  - 版本恰为 R4.0.020.002 的自动配置判定 → 按 needs-review nr-01 双口径如实说明，建议以更高版本执行
router_entry:
  name: oxo-connect-starter-router
  description: 'OXO Connect Starter 能力路由入口：按用户意图分发到 12 张能力卡——数据采集、系统开通、终端、编号计划与组、用户功能与信箱、SIP 中继、呼入闭锁、
    备份升级复位八个 promoted 能力，以及硬件平台、消息彩铃、安全基线、Rainbow 接入速览四张 router 能力卡。

    '
promotion_budget: 8
