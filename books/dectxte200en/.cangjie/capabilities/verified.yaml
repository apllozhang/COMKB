entry:
  name: dect-solutions
  description: 'OmniPCX Enterprise 的 DECT 无绳移动交付与运营支持：三条产品线（8379 IBS / 8378 IP-xBS / 8328 SIP-DECT）选型、PARI/PLI/PARK 标识体系与 multi-PARI 适配、IP-xBS 部署、空中同步/外部同步与多站点组网、手机注册与自动重注册、固件双轨升级、混合模式迁移、日常维护排障。适用于 OXE DECT 的配置、选型、组网与排障问答；无线工程设计方法论与生产安全基线不在原书范围内（见 out_of_scope）。'
  core_principles:
  - 选型先于配置：IBS（TDM、1 PARI/256 台/无加密）、IP-xBS（全 IP、8 PARI/2032 台、每站 11 通话+11 IP 中继）、SIP-DECT（SIP 语义、20 手机/站、区间无切换）三条线能力边界决定方案
  - 一切标识围绕 PARI 体系：PARI+RPN=RFPI、PARK=PLI+PARI 注册时写入手机、IPUI 认机；multi-PARI 靠降 PLI 做缩位匹配（混合模式必须适配 PLI，p227 WARNING）
  - 同步是 handover 的生命线：站间 RSSI≥-80dBm、同步树最深 24 级、外部同步 Sync Master 禁载通信且 Backup 强制、>2 PARI 需 Sync Highway；handover 只发生在同 Site 且同一 Data Sync Primary 之下
  - 开通路径标准化：全局参数（PARI/PLI/AC/安全级别）→ DHCP（vendor class alcatel.ipxbs.0）→ 注册（全网单节点开关）→ dectview 核验；换故障基站走手动注册保 RPN
  - 实验环境口径：教材网段、密码、AC、PARI 值仅限实验；引用容量与门槛数字必须带前提（-70/-60/-80dBm、11 通话+11 中继、254 台每 PARI/2032 台每节点）
  out_of_scope:
  - 无线覆盖设计方法论（传播模型、天线选型、勘测判定流程）——原书外置到《DECT and IP-DECT Engineering Rules》8AL90874USAA
  - 深度排障（PCAP 分析方法、日志深读）——外置到 8378 IP-xBS Troubleshooting Guide 8AL91443ENAA
  - 生产安全基线（WBM/AC 密钥治理策略、证书管理）与 DHCP/初始配置通用细节——书内只有字段名，细节在 8AL91047ENAD
  - RLAB 培训环境搭建、话务建模（Erlang）、OXE 系统级非 DECT 配置（SIP 中继、编号计划、板卡硬件规则）
  stop_conditions:
  - 用户要"设计 DECT 无线网络"（布点/天线/容量建模）→ 明确指向 8AL90874USAA，不以教材页数代替工程规则
  - 遗留机型（8212/8232/8242）维修、ATEX 部署细节、8328 双小区合计容量 → 书内无依据，如实声明书外（推断口径需标注）
  - 引用容量数字被追问话务前提 → 按"11 通话+切换余量"口径说明，不做 Erlang 承诺
  - 版本恰在边界（OXE R12.2、基站固件 v73b0003、重注册机型版本表 p252）→ 按书中版本表如实回答并建议先升固件
router_entry:
