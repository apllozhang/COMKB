  description: 'OXE DECT 解决方案能力路由入口：按用户意图分发到 12 张能力卡——标识号码、产品选型、IP-xBS 部署、同步与组网、手机注册、混合部署、自动重注册、固件管理八个 promoted 能力，以及维护排障、覆盖勘测、IBS 部署、SIP-DECT 四张 router 能力卡。'
