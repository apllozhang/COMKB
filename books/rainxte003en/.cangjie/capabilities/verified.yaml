entry:
  name: rainbow-oxe-integration
  description: 'Rainbow 与 OmniPCX Enterprise 混合云集成交付与运营支持：云侧公司/订阅/成员体系、OXE 接入（DNS/代理 + PBXID/激活码）与接入排障、REX/Ghost Z/tandem
    远程延伸路由、WebRTC 网关部署升级与 OXE 侧九件套配置、共享网关池与容量规划、4059EE 与 Rainbow 两套话务台、维护支持体系、Microsoft Teams 集成。适用于 Rainbow
    Hybrid on OXE 的配置、选型、排障与方案落地问答；生产化网络数值、TURN 部署与 Teams 租户策略不在原书范围内（见 out_of_scope）。

    '
  core_principles:
  - 混合云分工：OXE 保留呼叫控制与话音资源（trunk group/话务/留言/公号），Rainbow 提供协作、移动端与云服务；WebRTC 网关只建音频媒体关系，呼叫控制始终在 PBX
  - 云侧一切挂在 Company 体系下：BP 专属申报建 PBX 与开通付费订阅；成员一人不能属两家公司；电话服务必须 Business/Enterprise/Attendant 订阅
  - 接入与路由闭环按序推进：DNS/代理就绪（验证必须 nslookup/dig，URL ping 不算）→ PBXID+激活码接入 → 分机关联（RCC）→ REX/tandem 路由 → 网关解锁完整 VoIP；Essential 订阅只有 RCC 且不能改路由
  - REX/Ghost Z 是路由地基：每路 REX 并发呼叫占一个 Ghost Z，池大小即并发上限；Rainbow agent 按用户路由自动改写 REX——computer 路由写 BBB 前缀 17 位号走网关，mobile/home/other 走公共 trunk；tandem 两端必须 multi-line
  - 网关三重前提（成员 Business/Enterprise、OXE 12.1 MD4/12.2+、PBX 已接入且分机已关联）+ OXE 侧九件套（SIP TG/可信 IP/Rainbow type 网关/无压缩 IP 域/CDT/ARS/BBB 判别器/回调）缺一不通
  - 实验环境口径：教材密码、账号、网段与示例号码仅限实验；容量数字必须带口径（单网关 400 并发流，用户数与并发数是两个量纲）
  out_of_scope:
  - 端口/带宽/防火墙/TURN 具体数值（原书外置到 Rainbow Network Requirements PDF 与 VoIP calling Troubleshooting guide）
  - 编号计划设计与话务建模方法论（TBE067 工具本体与流量模型假设在书外）
  - RLAB 培训基础设施搭建细节（SIP 模拟器号码表等仅作背景，见 book/overview）
  - Teams 租户侧策略（应用权限策略、紧急呼叫、Direct Routing 共存）与 CPaaS 开发（developers.openrainbow.com）
  stop_conditions:
  - 需要生产网络数值或 TURN 部署位置选择 → 明确指向外部权威文档（Network Requirements PDF / VoIP calling Troubleshooting guide / TC2462），不以实验口径搪塞
  - OXE 版本低于 12.1 MD4/12.2 → 网关功能不可部署，先升级再交付，不硬配
  - 实验示例值（IP/账号/示例号码）与现场冲突 → 一律按现场重规划，实验值仅作格式参考
  - 涉及 RLAB/SIP 模拟器环境复现 → 参考 book/overview 环境区背景，不虚构生产配置
