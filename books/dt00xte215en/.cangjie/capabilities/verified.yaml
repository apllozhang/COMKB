  name: omniswitch-lan-access-router
  description: 'OmniSwitch LAN Access 能力路由入口：按用户意图分发到 13 张能力卡——AAA 加固、Lightning Config、配置生命周期、Virtual Chassis、
    VLAN 与路由、链路与生成树冗余、三层服务、QoS/ACL 策略八个 promoted 能力，以及 Access Guardian、诊断工具箱、LLDP 与 PoE、升级与 Auto-Fabric、
    Fleet 与 OST 工具五张 router 能力卡。

    '
