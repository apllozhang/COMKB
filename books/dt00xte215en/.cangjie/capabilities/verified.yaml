  title: OmniSwitch LAN Access Switching (Participant's Guide, Edition 23)
  author: ALE Training Services
  source_pack: DT00XTE215EN.pdf (587 pages)
  baseline_tag: OmniSwitch AOS R8 / 实验镜像 8.10.9.R04 / R-Lab
entry:
  name: omniswitch-lan-access
  description: 'OmniSwitch R8 接入/汇聚交换机的交付与运维支持：AAA 登录与管理面加固、Lightning Config 快速开局、配置保存/认证/回滚生命周期、
    Virtual Chassis 堆叠、VLAN/802.1Q 与 VLAN 间路由、链路聚合/STP/DHL 冗余、三层服务（DHCP/Loopback0/静态路由）与 VRRP 网关冗余、
    QoS/ACL 统一策略、Access Guardian 准入、诊断八件套、LLDP-MED 语音与 PoE、软件升级与 Auto-Fabric 零触开局、Fleet/OST 工具面。
    适用于 OmniSwitch LAN Access R8 的配置、组网、排障与方案落地问答；型号相关规格数值、升级操作步骤、RADIUS 服务器侧配置不在原书范围内（见 out_of_scope）。

    '
  core_principles:
  - 配置可靠性模型是三目录：running(RAM) 经 write memory 到启动目录、经 copy running certified / flash-synchro 固化认证基线；重启按内容异同回 certified 或 running，reload all 无条件回 certified
  - 一切管理入口是 AAA：七类服务各自认证链（本地库或 RADIUS/LDAP，exit-on-fail 语义），管理面收缩靠 ASA 限源、禁服务、会话参数与 SSH 强加密
  - 组网自下而上：VLAN 三入口（静态/UNP 分类/802.1Q）> 一个 IP 接口即激活路由 > 冗余四件套（LACP/STP/DHL/VRRP）按场景二选一，DHL 与 STP 不能混用于同一链路
  - QoS/ACL/PBR/镜像共用一个 policy 引擎：condition+action+rule 且 qos apply 才生效；默认 disposition 为 accept（不匹配即放行）
  - Access Guardian=UNP+RADIUS：Filter-Id 回传档案名决定 VLAN 与策略；服务器不可达走 auth-server-down 降级，无 MAC 登记一律 Block
  - 堆叠即一台交换机：ISIS-VC 选举（优先级>运行时长>最小 ID>最小 MAC），分裂防护靠 EMP 带外 RCD 与带内 VCSP，升级走 ISSU 滚动
  - 实验环境口径：教材地址/账号/实验数值仅限实验；型号规格（镜像会话数、PoE 预算、VC 上限全矩阵）以 Specification Guide/datasheet 为准
  out_of_scope:
  - 型号相关规格数值（镜像会话数全矩阵、PoE 预算、每型号 VC 上限细节）——原书外置到 Specification Guide/datasheet
  - 软件升级操作步骤与前置固件顺序——原书 p533 明示按 AOS Release Notes 执行
  - RADIUS/LDAP 服务器侧部署（用户库、证书、TLS 开启）与 vcboot.cfg 模板设计——书外依赖
  - 动态路由协议（OSPF/BGP）与组播协议的完整配置——本书仅触及 Auto-Routing 与 Loopback0 通告口径
  - R-Lab 远程实验环境搭建与产品选型（datasheet 域）
  stop_conditions:
  - 需要型号相关规格数值或全量命令参数 → 明确指向 Specification Guide / CLI Reference，不以实验口径或记忆值搪塞
  - 需要升级操作步骤 → 指向 AOS Release Notes；U-boot/ONIE/FPGA/CPLD 升级提示失败即 RMA 的风险边界
  - 涉及 RADIUS 服务器侧建设或割接治理流程（变更窗口/审批）→ 声明超出原书范围，不给编造步骤
  - 版本敏感参数（镜像会话数 2 vs 4、LLDP-MED 标记值、console 速率）→ 按 needs-review nr-01/02/04 双口径如实说明，以规格指南与实测为准
