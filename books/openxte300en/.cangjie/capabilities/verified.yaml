schema_version: 1
bundle_id: bundle.opentouch-starter
book:
  title: OpenTouch — OpenTouch Suite for MLE — Solution Overview / Starter (Participant's Guide)
  author: ALE Training Services
  source_pack: OPENXTE300EN.pdf (603 pages)
  baseline_tag: OpenTouch R2.6.1 / Starter Edition 10 / RLAB
entry:
  name: opentouch-starter
  description: 'OpenTouch Suite for MLE（OTMS/OTMS-v，含 OXE + OpenTouch + OmniVista 8770）的全流程交付与运维支持：SOT 自动化装机、Post-installation wizard 初始化、FlexLM 许可落地与核查、
    8770 双向节点声明与 OXE SIP 打通、prior management 号码路由、档案与用户供给（含 WPC 批量）、本地存储语音邮箱与 IMAP/通知/公告、证书部署、OTC PC 客户端与多终端、监督组，以及维护、备份与 rehosting（TC2149 矩阵）。
    适用于 OpenTouch Starter 站点的安装、配置、集成、排障与交付问答；容量与话务设计、OXE spatial redundancy 操作、SBC 安装、UM/Nomadic/OTBE 不在原书范围内（见 out_of_scope）。

    '
  core_principles:
  - '交付主线层层递进：装机 → 向导初始化 → 许可闸门 → 双向集成声明 → 号码路由 → 业务供给 → 安全与客户端 → 运维闭环（p50-51 主步骤链）'
  - '许可自成一体：FlexLM 校验锚定物（物理机 ALUID、虚拟机加密狗）；OXE 容量仍以本地 .swk 为准；向导许可页 OK 只代表文件在，不代表内容有效（p130-132, p159, p101）'
  - '三台服务器靠互挂成网：先 OXE 前置，再 8770 建树，然后声明 OT（bics.conf 三账号），最后 OT 侧挂 OXE；DNS 正反向解析是硬前提（p186-203, p93）'
  - '客户端是许可驱动形态：OTC PC 与 OTC PC One 同一二进制，Desktop 许可决定模式；软电话路线 Desktop 勾、Nomadic SIP 不勾（p433, p474）'
  - '实验环境口径：教材密码、账号、IP 与号码仅限实验（公开教学值）；rehosting 配错即死锁无回退，一切以 TC2149 矩阵为准（p16, p565-567, p579-602）'
  out_of_scope:
  - '容量与话务建模、虚机规格 sizing（原书外置到 Delivery note / Features list / Product limits）'
  - 'OXE spatial redundancy 的 SIP 与外部语音邮件网关操作（TC1652）'
  - 'SBC 与反向代理安装（TC2257/TC2639）与 UM 语音邮件、Nomadic、OTBE、VPN-less 会议地址（另见专项培训/另一手册）'
  - 'Teams/Skype for Business 深度集成与 OTC Mobile 移动端（原书仅一笔带过）'
  stop_conditions:
  - '需容量与话务设计或虚机规格 → 明确指向 Delivery note / Features list / Product limits，不以 5000 用户一条数字搪塞'
  - 'OXE 为 spatial redundancy 站点 → SIP 字段与外部语音邮件网关转 TC1652，不照抄单机实验步骤'
  - 'rehosting 前置不满足（参数未全对齐或无备份）→ 判停拒绝执行：配错即死锁且无回退（p565）'
  - '涉及 RLAB/ITSP1 实验环境搭建 → 参考 book/overview 实验环境区背景，实验值不虚构为生产配置'
  - 'UM 语音邮件、Nomadic、OTBE、Teams 深度集成 → 声明属书外专项培训/手册，不硬答'
router_entry:
  name: opentouch-starter-router
  description: 'OpenTouch Starter 能力路由入口：按用户意图分发到 12 张能力卡——初始化向导、许可 FlexLM、节点声明与 SIP、prior management、用户供给、语音邮箱、客户端多终端、维护 rehosting 八个 promoted 能力，
    以及 SOT 装机、证书、监督组、实验环境与连接四张 router 能力卡。

    '
promotion_budget: 8
