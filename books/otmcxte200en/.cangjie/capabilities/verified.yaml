bundle_id: bundle.ot-message-center
book:
  title: OpenTouch Message Center Starter (Participant's Guide, Issue 08)
  author: ALE Training Services
  source_pack: OTMCXTE200EN.pdf (259 pages)
  baseline_tag: OpenTouch Message Center R2.6 / OTMC 2.6.1 / OmniVista 8770 / OXE
entry:
  name: ot-message-center
  description: 'OpenTouch Message Center（OTMC，OXE 专用语音邮件服务器）Starter 级交付与运维支持：装机与 13 步站点配置、FlexLM 许可、8770 双向声明与同步、OXE 侧
    SIP 对接、Connection 用户与语音邮箱交付、profile 批控与问候语、SMTP/SMS 通知、备份恢复与语音信箱统计，以及自助门户、IMAP 访问、企业广播三块增值能力。适用于
    OTMC 的安装、纳管、对接、开箱到业务与日常运维问答；HA、UM 落地、硬件规格与容量规划不在原书范围内（见 out_of_scope）。

    '
  core_principles:
  - OTMC 是 OXE 专属外挂信箱：单服务器独立部署，消息存本地（LS）或统一消息（UM），访问通道三条——任意话机 TUI、8xx8/8088 话机 GUI、IMAP 邮件客户端
  - 配置管理唯一大脑是 OmniVista 8770：OXE/OTMC 双向声明并同步后一切经 8770；OTMC 自身 WBM 只做辅助（改密、问候语、IMAP 前端参数）
  - 上线顺序刚性：OS → core → 13 步向导 → 8770 双向声明同步 → OXE SIP 对接（单 trunk、端口 5040）→ 用户与信箱；信箱创建必须挂 profile
  - 外部设施依赖明确：许可走 flex-lm（.ice + ALUID/dongle，向导 OK 不校验有效性）；通知走外部 SMTP（无认证无 TLS、经 VPIM 路由）；DNS 必须前向+反向解析七类 FQDN
  - 实验口径纪律：教材密码/账号/网段仅限实验；15000/5000 为标注口径，生产规格以 feature list / product limits 为准
  out_of_scope:
  - HA 高可用配置（原书仅留指针，属后续课程；启用前置为副服务器 + 两台同时跑向导）
  - 硬件/软件规格与产品上限、容量规划工具用法（feature list / product limits / OpenTouch Capacity Planning Tool）
  - UM（Exchange/Lotus Domino/Gmail）落地与三方 VM 互通（VPIM）配置细节（原书仅支持性声明）
  - AA 自动话务员配置、OXE 侧 DHCP 管理、Teams/SIP 话机生态对接
  stop_conditions:
  - 需要生产网络规格或产品上限数值 → 指向 feature list / product limits 与 MyPortal 安装手册（otmc2.6.1），不以实验口径搪塞
  - 空间冗余 SIP 网关或 8770 上 NFS 部署 → 指向 TC1652 / TC2024，不在本书找步骤
  - 书内口径漂移类提问（OTMC 节点号 98/99、defaultVmLS 拼写、GA wav 路径、151/155 网段）→ 按 needs-review 双口径如实说明
  - 问 AA 配置或 HA 部署 → 明确超出 Starter 范围，转对应课程/文档
router_entry:
  name: ot-message-center-router
  description: 'OpenTouch Message Center 能力路由入口：按用户意图分发到 12 张能力卡——装机站点配置、许可管理、声明同步、SIP 对接、用户与信箱交付、profile 与
    问候语、SMTP/SMS 通知、备份与统计八个 promoted 能力，以及产品定位、自助门户、IMAP 访问、企业广播四张 router 能力卡。

    '
promotion_budget: 8
