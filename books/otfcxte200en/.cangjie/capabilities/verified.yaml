entry:
  name: ot-fax-center
  description: 'OpenTouch Fax Center（OTFC）纯软件 FoIP 传真服务器的首次交付与长期运维支持：宿主准备与软件安装、 First Time Setup Wizard 最小可用系统、许可两级控制、
    与 OXE 的 SIP 话路对接（含 OXE 侧 MGR 七步与传真抓包）、SMTP/Exchange 邮件集成、用户/管理员/Profile 策略体系、目录集成与来传真路由、服务架构运维、备份升级与删除策略。
    适用于 OTFC 的配置、选型、排障与方案落地问答；生产化端口全表、OXE 侧网关参数与 HA 部署不在原书范围内（见 out_of_scope）。

    '
  core_principles:
  - 四级模型：System 管 Site，Site 是隔离的虚拟传真服务器（一份传真只属一个站点），用户恒以 SMTP 地址标识且必须绑定 Site+Profile 才能用系统
  - 交付主线四步：准备服务器（DNS 正反解/IIS 四角色服务/服务账号/Office 预初始化）→ 装软件（禁用 MS SMTP 释放 25 端口）→ FTW 十二项搭最小可用系统 → 许可去水印解锁通道
  - 两大外部集成缺一不可：OXE 侧 SIP 话路（OTFC UDP 5360 + MGR 七步 + TC3048）与邮件通道（SMTP 网关独占 25 + Exchange FAX 地址空间连接器）
  - 运维闭环：9 服务分有状态（复制）/无状态（负载均衡），xmsc -ra/-oa/-aa 一键启停；备份冷备不可 kill、恢复可 kill；升级五步法且数据库不在自动备份内
  - 实验环境口径：教材密码、IP、账号、号段仅限实验；端口全表、45 格式、sizing 一律外置 OTFC Features List
  out_of_scope:
  - 端口使用表全表、服务器资源推荐数值、45 种格式明细、浏览器支持清单（原书外置 OTFC Features List）
  - OXE 侧 SIP 网关参数细节（编码/号码变换/中继属性，原书明示参照 TC3048，本书只给 MGR 菜单骨架）
  - XMFaultTolerance 高可用部署与演练、SIP/TLS 加密信令启用路径（书内零实操）
  - 许可商务流程细节、GDPR/HIPAA 类合规条款解读、OmniVista 8770 侧报表配置
  stop_conditions:
  - 需要生产端口白名单或 sizing 数值 → 指向 OTFC Features List（书内 p38/p42 为指针页），不以实验口径搪塞
  - OXE 侧互通做不通或要配中继参数 → 先要 TC3048 再上站，本书菜单骨架不足以保证话路通
  - 客户要 HA/Failover 部署或 TLS 加密话路 → 声明书内边界，转产品文档/专业服务，不虚构步骤
  - 涉及实验环境复刻（192.168.1.x 网段、Alcatel1!@123、mtcl） → 参考 book/overview 环境区背景并标注实验口径，不进生产
router_entry:
  name: ot-fax-center-router
  description: 'OTFC 传真中心能力路由入口：按用户意图分发到 11 张能力卡——首次交付、SIP 通道集成、邮件与 Exchange 集成、用户管理、Profile 策略、目录与路由、
    服务运维、备份升级八个 promoted 能力，以及客户端与封页、方案规划、报表监控三张 router 能力卡。

    '
