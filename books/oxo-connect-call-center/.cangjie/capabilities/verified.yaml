- capability_id: cap.oxo-cc.queue
  revision: 1
  status: active
  slug: oxo-acd-queue
  title: ACD 等待队列管理（容量公式与出口配置）
  importance: high
  importance_rationale: 对应 task-07，队列长度与等待播报直接影响来电体验；公式配置错误导致劝漏过早
  one_liner: 队列长度 = ceil(On duty 坐席数 × K)，K∈0.1-9.9、上限 16；等待播报 = (队列数/坐席+1)×平均通话时长
  intents:
  - 队列长度怎么设
  - 排队等待时间播报
  - queue length
  - estimated waiting time
  - 队满了还来电
