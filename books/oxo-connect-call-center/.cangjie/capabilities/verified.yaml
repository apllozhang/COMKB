schema_version: 1
bundle_id: bundle.oxo-connect-call-center
book:
  title: OXO Connect 呼叫中心 (Participant's Guide, Edition 07)
  author: ALE Training Services
  source_pack: OXOCXTE107EN.pdf (218 pages)
  baseline_tag: OXO Connect R6.x / RLAB
entry:
  name: oxo-connect-call-center
  description: 'OXO Connect 呼叫中心（ACD）交付与运营支持：从 OMC 安装、基础 ACD 搭建、 呼入场景排障、特征化路由、队列与搜索模式调优，到坐席签入签出、多秘书方案、
    Supervisor/Agent/Statistics 三件套部署与语音定制。适用于 OXO Connect R6.x 时代的 配置、排障与方案落地问答；生产化安全加固与话务容量规划不在原书范围内（见
    out_of_scope）。

    '
  core_principles:
  - 一切呼入行为先归入六场景之一（空闲/全忙/队满/端口忙/全员登出/组关闭），再谈配置与排障
  - 配置分两层：ACD Setup 向导一次成型，ACD Services 菜单精细调整；改完向导必须重启 ACD 引擎才生效
  - 呼叫特征化按 CLI(左→右)+DDI(右→左) 三级优先匹配，路由表从最特殊填到最一般
  - 队列长度 = ceil(On duty 坐席数 × 话务因子 K)，上限 16；坐席状态与登录状态是两类独立排障维度
  - 实验环境口径：教材密码（pbxk1064/Acdc1064）与网段仅限实验，生产必须替换并做安全加固
  out_of_scope:
  - 生产环境安全加固、SBC/真实中继对接、防火墙策略（原书仅 RLAB 模拟器口径）
  - 话务量分析与坐席/端口容量规划方法论（原书仅给许可包与上限）
  - 非 OXO Connect 平台的呼叫中心（OmniPCX Enterprise ACD、OpenTouch Contact Center 等另属其他教材）
  stop_conditions:
  - 需求超出 OXO Connect 平台范围（如 32 坐席以上、跨站点容灾）→ 转对应产品线教材或 ALE 预销售支持
  - 涉及 RLAB/SIP 模拟器环境搭建细节 → 参考 book/overview 环境区，不虚构配置步骤
  - 用户问的是生产安全/加固 → 明确声明超出原书范围，避免以实验口径误导
router_entry:
  name: oxo-connect-call-center-router
  description: 'OXO Connect 呼叫中心能力路由入口：按用户意图分发到 15 张能力卡——基础搭建、六场景排障、 特征化路由、队列、搜索模式、签入签出、多秘书七个 promoted
    能力，以及 OMC 首连、IP 规划、 营业日历、Supervisor/Agent/Statistics 三件套、DTMF 弹屏、语音定制八张 router 能力卡。

    '
promotion_budget: 8
