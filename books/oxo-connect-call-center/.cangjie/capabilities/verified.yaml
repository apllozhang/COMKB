  - queue
  - N×K
  - traffic factor
  - 话务因子
  - 等待时间
  - 星号退出
  - Call management
  - 劝漏出口
  also_read:
  - oxo-acd-login-status
  - oxo-acd-search-noanswer
  - oxo-acd-call-scenarios
  card: cards/queue.md
  frontmatter:
    description: '配置与解释 OXO ACD 等待队列：按 N×K 公式定队列长度、配置队列消息（排名/预计等待

      时间阈值）、设置队满/星号退出出口（组邮箱或转号码）。当用户问"队列设多大/等待时间

      播报怎么配/第二通电话就被挂"时使用。注意 N 只数 On duty 坐席；公式为线性简化模型，

      高峰会低估。不适用于端口全忙劝漏（归六场景排障）与坐席搜索顺序（用搜索模式能力）。

      '
