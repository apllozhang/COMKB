schema_version: 1
bundle_id: bundle.oxe-sip
book:
  title: OmniPCX Enterprise - SIP (Participant's Guide, Edition 12)
  author: ALE Training Services
  source_pack: ENTPXTE403EN.pdf (465 pages)
  baseline_tag: OmniPCX Enterprise R101.1 MD4 / RLAB
entry:
  name: oxe-sip
  description: 'OmniPCX Enterprise（OXE）SIP 化交付与运维支持：SIP 协议机理与六组件架构、SEPLOS/SIP Device 两形态选型与容量、SIP Device 与 ALE 话机与 ALES 软终端三条开通线、
    OXE DM 证书体系、经 SBC 的运营商接入与 OTSBC 部署、远程办公（SBC/RP/EDS/VPN）、编解码与信令排障。适用于 OXE 站点 SIP 化的配置、选型、排障与方案问答；
    真实运营商参数、外部 CA 流程、零touch 开户等生产化依据不在原书范围内（见 out_of_scope）。

    '
  core_principles:
  - SIP 只做信令不做媒体搬运：会话建立/维持/修改/终止归 SIP，媒体协商靠 SDP、传输靠 RTP；OXE 六组件（本地网关/字典/代理/注册器/位置/外部网关）同栖 sipmotor
  - SIP 用户两形态决定服务等级：SEPLOS=内部话机级（前缀后缀/寻线组/CTI），SIP Device=远端子网设备级（五不带）；软件锁 177/345/430 与 15000 用户/20000 设备管规模
  - 终端入网四步链：DHCP 拿 DM 地址 → HTTPS 拉 DM 配置文件 → 拉二进制 → SIP 注册；注册即服务、超时即离服；一切发起请求的设备必须是 CS 防火墙信任主机
  - 证书是地基：默认证书只适配 WBM，须内部 PKI 定制（SAN 含 FQDN/通配/IP）并产出 CTL；R101.0 起 OpenSSL 安全级 2 拒收 RSA<2048 位或 SHA-1
  - 外线双腿施工：OXE 侧（信任主机/中继组/外部网关/ARS/DID/NPD/回拨）+ OTSBC 侧（向导+编解码放行/消息域改写/Contact User 注册），缺一不通
  - 远程办公两条路：SBC/RP（≤500 用 OTSBC 内嵌反代）与 VPN（仅 ALE-2/3 内嵌 OpenVPN）；EDS 零touch 四限制；远程加密放行是 N4 起语义
  - 实验环境口径：教材密码、账号、号码全部为 RLAB 实验值（模拟运营商与真实 ITSP 行为差异大）；生产以 TC2005/TC2957/Features List 等权威文档为准
  out_of_scope:
  - 真实运营商参数（REGISTER 行为、SIPS 强制、P-Asserted-Identity 策略、号码格式）——以 TC2005 与运营商文档为准（原书明示书外）
  - 外部 CA 申请签发流程、企业 PKI 策略、安全加固制度（原书只给机制与内部 PKI 演示）
  - EDS 账号开通操作与 NGINX PLUS 反代部署细节、VPN 网关兼容清单（指向 EDS user manual、Server deployment Guide for Remote workers）
  - SBC 高可用与容量规划、话务建模与带宽估算方法论（原书无性能章节）
  - SIP 协议报文逐字段教学与 Wireshark 深度分析（属协议基础课）；Teams/Rainbow 等外部生态集成细节
  stop_conditions:
  - 话务台坐席/ACD/呼叫中心、酒店全量业务（8008 例外）在 SIP 侧缺席或受限 → 声明形态边界，回 NOE 或改方案，不硬配
  - 客户要照书直配真实运营商 → 停，先拿 TC2005 与运营商参数表再动手
  - 版本低于特性门槛（R101.1 的 8443 mTLS、N4 的远程加密放行、N3 的 SSH 强制）→ 先核对版本再谈功能
  - 涉及 RLAB/ITSP 实验环境搭建 → 参考 book/overview 环境区背景并声明实验口径，不虚构生产配置
  - 用户数/并发超出许可与容量口径（177/345/430 锁、15000 用户/20000 设备、RP ≤500）→ 走扩许可或换方案，不硬撑
router_entry:
  name: oxe-sip-router
  description: 'OXE SIP 能力路由入口：按用户意图分发到 13 张能力卡——协议基础、形态选型、SIP Device 开通、话机开通、ALES 开通、证书、SBC 运营商接入、远程办公八个 promoted 能力，
    以及编解码、跟踪排障、DM 管理、业务特性、实验环境五张 router 能力卡。

    '
promotion_budget: 8
