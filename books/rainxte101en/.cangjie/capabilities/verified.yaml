entry:
  name: rainbow-hub
  description: 'Rainbow Hub 纯云话音交付与运营支持：公司/Voice 订阅云侧开户、Cloud PBX 声明与编号计划/号码/闭锁、成员五通道开户与话务配置、ALE 设备 zero-touch 与 DECT 部署、
    设备维护与 Generic SIP 评估、呼叫组/话务台/欢迎服务与 IVR、多站点、分析与维护支持。适用于 Rainbow Hub（纯云，全托管 Cloud PBX）的开户、配置、排障与方案落地问答；
    生产化网络数值、trunk 合同与 DID 紧急定位登记不在原书范围内（见 out_of_scope）。与混合云（RAINXTE001EN）的差异点：Voice 前缀订阅、Cloud PBX、BP 四项专属、zero-touch。
    '
  core_principles:
  - 纯云架构：话务核心全托管云侧 Cloud PBX，客户侧无 PBX/SBC/VPN；一公司一 Cloud PBX、一 PBX 一条外部 SIP trunk
  - 云侧顺序硬约束：BP 建公司（时区强制）→ 至少一条 Voice Business/Enterprise 订阅 → 才能声明 Cloud PBX → 公网号码 → 终端 → 成员 → 功能
  - 权责切分：BP 独占 PBX 声明/付费订阅/终端声明/电话线四项；客户管理员做成员、组、欢迎服务等日常配置
  - 端侧三等供给：ALE 原生（zero-touch、集中管理）优先于入门档，第三方 Generic SIP 仅做补充（手工配置、无 RCC、ALE 不为大规模兜底）
  - 话务能力域参数化：组 50 人、队列溢出 10-900 秒、监督 5 页签/30 人、IVR 3 级无许可、录音存 2 个月——引用数字必须带口径
  - 实验环境口径：教材账号、密码、号段仅限实验；培训禁预付是实验规则，生产预付正常
  out_of_scope:
  - 端口/带宽/防火墙全集与 TURN 数值（原书外置到 Network Requirements 文章与 PDF，书内仅两张局部摘录）
  - trunk 合同、资费、号码携转、DID 地址登记（紧急定位）——BP/运营商侧
  - 编号计划设计方法论、话务建模、提示音文案制作、DECT 无线勘测（原书不讲）
  - Teams 集成、WebRTC 网关、OXO/OXE 接入（混合云产品线，属 RAINXTE001EN 语系）
  stop_conditions:
  - 客户要保留现有 PBX 接云（混合云形态）→ 转 Rainbow 混合云产品线（RAINXTE001EN 语系），不套用 Hub 开户流程
  - 需要生产网络数值或 SR 流程细节 → 明确指向外部权威文档（Network Requirements / TBE099 / TBE127），不以实验口径搪塞
  - 涉及 RLAB/MicroSIP 环境搭建 → 参考 book/overview 环境区背景，不虚构生产配置
  - 成员配号订阅门槛出现 Voice Phone 争议 → 按 needs-review nr-01 双口径如实说明（p194 括注疑不完整，以 p66 四档口径为准）
  - 紧急呼叫定位与合规诉求 → 声明责任链（BP 登记 DID 地址、运营商判 PSAP、Rainbow 不管），不替 BP/运营商承诺
router_entry:
  name: rainbow-hub-router
  description: 'Rainbow Hub 能力路由入口：按用户意图分发到 12 张能力卡——公司订阅、Cloud PBX、成员话务、zero-touch 部署、设备维护、呼叫组、话务台监督、欢迎服务 IVR 八个
    promoted 能力，以及网络就绪、多站点、分析、维护支持四张 router 能力卡。
    '
promotion_budget: 8
