schema_version: 1
bundle_id: bundle.oxe-starter
book:
  title: OmniPCX Enterprise - Starter (Participant's Guide, Edition 12)
  author: ALE Training Services
  source_pack: ENTPXTE400EN.pdf (821 pages)
  baseline_tag: OXE R101.1 MD4 / RLAB / ITSP1
entry:
  name: oxe-starter
  description: 'OmniPCX Enterprise（OXE）基础开局与日常维护的准入闭环：安全登录与密码治理、系统启停、CS 双地址与内部防火墙、NTP/chrony 对时、空库与 OPS 许可、
    三类媒体网关上架（GD4/OMS/XL）、用户终端开通（IP 话机/IPDSP/TDM/Profile/DHCP）、编号计划与 COS、呼叫处理业务域（语音指南/话务台/Entity/计时器）、
    公共 SIP 中继全链路与弹性、外呼闭锁与紧急呼叫、备份恢复与维护排障、T0/T2 传统中继与 UMC 云管理。适用于单机（stand-alone）口径的开局、配置、
    拨测与一线排障问答；高可用组网、Cloud Connect 深度、运营商生产参数不在原书范围（见 out_of_scope）。

    '
  core_principles:
  - 准入链顺序即实验顺序：登录加固 → 启停 → IP/防火墙 → 时间 → 空库与许可，前一步是后一步的前提；跳章必须自检依赖
  - 双 IP 地址体系：物理接口地址永远可达（含话务停止），Role MAIN 地址仅话务运行时生效——设备与外部应用统一指向 Role 地址；停话务后传文件必须用物理地址
  - 安全基线 N3 起默认全关：iptables 默认 DROP 入站/转发，互通全靠可信主机白名单；"Allow SSH for all" 只是开局便门，配完必须 Deny 收口
  - 库与许可是一对：空库创建连 OPS 一起抹掉，"停话务 → 建库 → 恢复 OPS → 起话务"顺序不可乱；软件每 5 天自查许可，CPU-ID 不一致给 30 天宽限再进降级三阶段
  - 业务路由固定流水线：ARS 前缀 → 鉴别符 → ARS 表 → 中继组 → NPD → DID 翻译器 → 外部网关；闭锁 = Area × Public COS × 实体状态（默认 Night 态）的交点
  out_of_scope:
  - CS Duplication 空间冗余、PCS、多节点组网（原书明示 Advanced 课程）
  - Cloud Connect/RTR 深度与 FlexLM 服务器搭建（ENTPXTE402 与 CPU Loading 课程）
  - SIP 运营商生产参数与紧急显示管理（TC2005 与运营商文档）；4645 防盗打加固（SA0046/TC1774）
  - 话机硬件规格目录、Crystal 硬件细节、产品限额全集（MyPortal 文档组）；SBC/QoS/中继深调
  stop_conditions:
  - 需要空间冗余、多节点组网或 PCS 方案 → 超出 Starter 单机口径，转 Advanced 课程口径并显式说明
  - 需要具体运营商 SIP/ISDN 参数（号段/信令变体/CLIR/紧急显示）→ 指向 TC2005、SA0046/TC1774 与运营商文档，不照抄实验值
  - 涉及 RLAB/ITSP1 实验环境值（密码/IP/账号/号段）→ 按 book/overview 实验口径声明处理，不当作生产配置
  - 用户要求把教材密码照搬上生产 → 拒绝，给出首登加固的改密与策略收紧步骤
router_entry:
  name: oxe-starter-router
  description: 'OXE Starter 能力路由入口：按用户意图分发到 14 张能力卡——首登加固、CS 网络与防火墙、空库与许可、媒体网关上架、用户终端开通、
    编号计划与 COS、呼叫处理、公共 SIP 中继八个 promoted 能力，以及系统启停、时间同步、4645 语音邮件、闭锁与紧急、备份与维护排障、传统中继与 UMC 六张 router 能力卡。

    '
