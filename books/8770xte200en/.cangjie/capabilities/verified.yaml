entry:
  name: omnivista-8770-nms
  description: 'OmniVista 8770 网络管理平台的安装与日常运维闭环：Windows 服务器/客户端安装、 OXE 与 OXO Connect 节点注册同步、
    用户开通（Profile/Meta profile/批量/WBM）、告警接入与出口（邮件/脚本/SNMP Proxy）、权限与审计、报表任务与自动维护、
    8770/OXE 两层备份恢复、许可管理。适用于 8770 R5.2 单机交付与运维问答；高可用设计、生产安全基线与容量规划工具不在原书范围内（见 out_of_scope）。

    '
  core_principles:
  - 8770 是装在专用 Windows 服务器上的套件集合体（MariaDB + LDAP + Apache/Wildfly + 应用套件），安装参数（公司名/成本中心/端口/目录管理器登录）装后大多不可改，唯一后悔药是 RestoreContext.ini + 备份恢复/rehosting
  - 节点接入的钥匙是号对号：声明节点号 = 网络号×100 + 节点号，与 OXE siteid 一致才能同步；OXO Connect 同理换算（如 1x100+80=180），备份目录按声明节点落盘
  - 同步是数据流起点：Complete/Partial × Separate/Global 四语义按需选；OXE 改动经实时事件回传，但 profile、键 profile、空闲号码段必须主动同步才可见
  - 告警集中在 Alarms：相关/非相关决定自动/手动清除；出口三条——人工签名、邮件（server:port 语法）、脚本（%1/%2 变量），对外走 SNMP Proxy（trap 162，hypervisor 只填 IP）
  - 安全三层：8770 账户/组（多组取最高）> OXE Access Profile（11 档全体 OXE 共用，改后删本地 MIB）> OXE 侧访问白名单（Secure access 前提）
  - 兜底双铁律：备份与版本强绑定（nmcVersion）且备份期网管不可用、OXE 恢复须停电话；许可超限进受限模式（仅 Directory+Configuration，服务器不停机）
  out_of_scope:
  - 8770 高可用/双机/多 8770 分级设计（书内仅许可 Redundancy 字段一笔带过，生产引 High Availability 文档）
  - 生产安全基线（实验明文密码替换、Defender 排除与 IE ESC 关闭的客户审批、POODLE/TLS 全网元摸底方法）
  - RLAB 实验平台搭建、hypervisor 侧 SNMP 规则、Capacity Planning 工具用法
  - OXE 侧系统命令完整语法（siteid/netadmin/swinst 只教 8770 视角）与话务分析深水区（仅 OXE 且未展开）
  stop_conditions:
  - 用户要求生产环境照抄本书实验密码/IP/账号 → 拒绝并引用 B 边界（实验口径，见 needs-review nr-06）
  - 要求跨版本恢复 8770 备份或 OXE 恢复不接受停电话窗口 → 判停说明前提，不提供"热恢复"方案
  - 需要 8770 集群/容灾/多级网管方案 → 超出单机闭环，转 High Availability 产品文档
  - OXO 章法语残句影响理解 → 按 needs-review nr-02 语义转述，不逐字引用
