bundle_id: bundle.otcc-advanced-call-routing
book:
  title: OmniTouch Contact Center Standard Edition — Advanced Call Routing (Participant's Guide, Issue 01)
  author: ALE Training Services
  source_pack: OTCCXTE150EN.pdf (470 pages)
  baseline_tag: OpenTouch Suite for MLE / OXE + OTCC Standard Edition Issue 01（实验环境含 MS SQL Server 2016、Access 2016）
entry:
  name: otcc-advanced-call-routing
  description: 'OTCC 标准版高级呼叫路由（ACR）的交付与排障支持：基础 CCD 矩阵地基（双 Pilot、等待房间、坐席技能档案）、ASM 脚本编写调试工具链、九种路由规则及组合语义（APPLY 链式过滤）、
    坐席直拨融合（DICA）、内部数据库三键路由、Call Tag 传递、多语言引导、IQUEUE/LIST 等高级构件、过滤器统计、外部 ASM 部署割接与双机热备、外部数据库 SQL 查询与 LCA 持久化。
    适用于 OTCC Standard Edition 的 ACR 配置、脚本、排障与方案问答；容量测算方法、多节点组网与安全基线不在原书范围内（见 out_of_scope）。

    '
  core_principles:
  - ACR 的本质是脚本选坐席：CCS 内嵌编辑器写脚本（.scr 源/.alb 编译），ASM 服务器解释执行并按呼叫特征返回动态坐席列表；选人归 ASM，呼叫控制仍在 CCD 矩阵
  - 分发三步固定：呼叫特征化关联档案进 Pilot，ASM 算列表（动态组），呼叫带列表进等待房间；房间与队列互斥且房间不按 FIFO
  - 规则分两族：单用规则（LCA/Redirection/Redistribution/IVR）独占 APPLY；可组合规则（名单/ISM/IDLE/COM）可串接；单 APPLY 链式过滤，多 APPLY 第一个失效；IDLE 与 COM 互斥
  - 空列表必有两式兜底：Redirection 转号或 Redistribution 退下一路由方向，全无方向落 Blockage；脚本空列表重试原书两处口径 20/21 次
  - 呼叫选择统一排座次：优先级 0-9（0 最高），再按 ACR Actual Waiting 决定 ISM 成本与实际等待谁先；等待队列里普通 CCD 呼叫 ISM 成本为无穷（ACR 默认插队）
  - 外部化三线：外部 ASM 角色与内部 alb 一致（割接先 asm_on_dhs=0 停内部）、双机 Main/Stand-By 自动复制；外部库走 32 位 ODBC 加 167 号许可，存储过程可把 LCA 落库抗重启
  - 实验环境口径：教材对象编号（3xXXX）、账号口令、IP 仅限实验；引用容量数字必须标注原书 Issue 01 口径
  out_of_scope:
  - 规模测算方法（话务量、Erlang、坐席数规划）——原书只给 p18 容量上限表，"该建多少"在书外
  - MS SQL Server/Access/SSMS 界面操作细节与语音引导录制内容——通用软件与环境操作，书内仅给与 ACR 相关的字段、账号与过程约定
  - 安全基线（强口令、最小授权、传输加密、SQL 注入防护）——原书系统性缺席，仅有实验口令口径
  - 多节点组网 ACR 细节与混合链路以外的网络规划、OXE 侧冗余与脚本版本管理
  stop_conditions:
  - 需要容量测算或坐席数规划 → 指向 OXE 侧配套文档与 Feature List，不以 p18 上限表冒充测算方法
  - 数据库安装、界面点选、录音制作类请求 → 声明属通用技能/环境操作，只保留 ACR 相关约定
  - 生产环境安全设计 → 按实验口径警示并建议叠加安全基线（整改方向为推断，原书未讨论）
  - 版本敏感判定（asm_ag_free_duration 最低 l2.300.32.a、patchIdle 已废弃）→ 按 needs-review nr-08 口径如实说明
router_entry:
  name: otcc-advanced-call-routing-router
  description: 'OTCC ACR 能力路由入口：按用户意图分发到 12 张能力卡——脚本编辑器、CCD 矩阵地基、重定向再分发、直拨融合、内部数据库、综合规则组合、外部 ASM 部署、
    外部数据库查询八个 promoted 能力，以及名单规则、Call Tag 传递、多语言引导、过滤器统计四张 router 能力卡。

    '
promotion_budget: 8
