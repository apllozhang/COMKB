bundle_id: bundle.rainbow-oxo-connect
book:
  title: Rainbow OXO Connect (Participant's Guide, Edition 13)
  author: ALE Training Services
  source_pack: RAINXTE001EN.pdf (251 pages)
  baseline_tag: Rainbow / OXO Connect R6.3 SP149 / RLAB
entry:
  name: rainbow-oxo-connect
  description: 'Rainbow 与 OXO Connect 混合云集成交付与运营支持：云侧公司/订阅/成员体系、 OXO 接入（PBXID+激活码）与接入排障、WebRTC 网关三拓扑选型与部署、
    虚拟终端与 UTL 口径、话务台与监督组、Rainbow/Teams 集成、维护支持体系。适用于 Rainbow Hybrid on OXO Connect 的配置、选型、排障与方案落地问答；
    生产化网络数值、编号计划与 Teams 租户策略不在原书范围内（见 out_of_scope）。

    '
  core_principles:
  - 混合云分工：PBX 保留呼叫控制，Rainbow 提供协作/移动/云服务；WebRTC 网关只建音频媒体关系（排障先分媒体面与呼控面）
  - 云侧一切挂在 Company 体系下：BP 专属建 PBX 与开付费订阅，成员须持 Business/Enterprise/Attendant 才有电话服务
  - 接入闭环按序推进：建公司开订阅 → OMC 首连 → PBXID 接入 → 分机关联（RCC）→ 网关解锁完整音频
  - 网关三拓扑功能等价：集成（R3.2+/20 通话/免 SIP trunk 许可）、OCE-FE（双端 ≥R4.0 MD/20）、外部 VM/NUC（50）；自动配置 R4.0.020.002 起且仅 Reseller 管理员可激活，终端/编号计划/闭锁仍归安装员
  - 实验环境口径：教材密码、账号与网段仅限实验；引用容量数字必须带话务前提（150 用户上限仅极低话务成立）
  out_of_scope:
  - 端口/带宽/防火墙/TURN 具体数值（原书外置到 Rainbow Network Requirements PDF 与安装指南）
  - 编号计划与闭锁配置、话务建模方法论（原书明示安装员自做且不教）
  - OCE-FE 多场景开局细节（必须按 MyPortal 最新版 Rainbow WebRTC cookbook）
  - Teams 租户侧策略（应用权限策略、紧急呼叫、Direct Routing 共存）与非 OXO 平台（OXE 详节见 TC2462）
  stop_conditions:
  - 用户数超 150 或需跨站点容灾 → 超出 OXO Rainbow VoIP 范围，转其他产品线方案
  - 需要生产网络数值或 FE 开局操作步骤 → 明确指向外部权威文档（Network Requirements PDF / cookbook / TC2479），不以实验口径搪塞
  - 涉及 RLAB/SIP 模拟器环境搭建 → 参考 book/overview 环境区背景，不虚构生产配置
  - 版本恰为 R4.0.020.002 的自动配置判定 → 按 needs-review nr-01 双口径如实说明，建议以更高版本执行
router_entry:
  name: rainbow-oxo-connect-router
  description: 'Rainbow OXO Connect 能力路由入口：按用户意图分发到 12 张能力卡——公司订阅、OMC 首连、PBX 接入、成员管理、网关规划、网关部署、话务台监督、
    Teams 集成八个 promoted 能力，以及管理员工具、分机关联 RCC、维护支持、网络就绪四张 router 能力卡。

    '
