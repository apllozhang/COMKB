  author: ALE Training Services
  source_pack: ENTPXTE402EN.pdf (415 pages)
  baseline_tag: OXE R101.1 MD4 / S.O.T. / Cloud Connect / OPEX PoD / RLAB
entry:
  name: oxe-loading
  description: 'OmniPCX Enterprise（OXE）软件加载与云许可交付支持：用 S.O.T. 部署工具完成 CS 从物理板卡、虚机到 GAS 一体机的全形态软件加载与补丁/多版本管理，OXE-V 虚拟化选型与虚机交付，GAS 加载与后安装，Cloud Connect 云连接（FTR/RTR），OPEX/Purple on Demand 订阅许可与 LMS 同步。
    适用于 OXE 软件交付、云注册与订阅许可的配置、排障与验收问答；OXE 数据库业务配置（用户/路由/编号计划）不在原书范围内（见 out_of_scope）。

    '
  core_principles:
  - 一切软件交付围绕 S.O.T.：一台自带 DHCP/FTP 服务的虚机，Standalone 加载物理机、Hosted 加载虚机；一次只允许一个部署任务
  - 双分区是升级安全模型：第二版本不停话音装好、切换才重启；静态补丁停话音或装 inactive，动态补丁可热装但必须在静态之后；补丁累积包含此前全部修正
  - 虚拟化平台决定许可路径：FlexLM+加密狗仅 ESXi/KVM；Hyper-V/Nutanix/AWS 必须 Cloud Connect；FlexLM 与 RTR 两种模式互斥
  - FTR 是云服务门禁：swk 含 CCSID、电话应用已启动、连通性全绿才能注册；备机禁做 FTR；panic 后 PIN 是唯一出路
  - RTR 与 LMS 都靠对账维持许可：RTR 资格期 30 天起、OK 加 0.5 天/NOK 减 1 天；OXE 每 4 小时与 LMS 对账，失联或超订会进 panic 逐渐锁死系统
  - 实验环境口径：教材密码、账号与网段仅限实验；加载 completed 之后角色寻址、许可恢复、业务配置是独立的后置清单
  out_of_scope:
  - OXE 数据库业务配置（用户创建、编号计划、路由、话机开通）——原书指向 Starter 课程
  - 虚拟化设计权威细节（TBE043）、AWS 部署（TC3142en-Ed01）、GAS 安装权威步骤（TC3138）
  - N3 以下版本迁移的执行细节（TC3104en-Ed08 指南）
  - 生产安全基线加固与容量规划方法论（原书仅引用 CIS 条目一次，不展开）
  stop_conditions:
  - 需要建用户/配路由/做编号计划 → 明确超出本书范围，指向 Starter 课程，不以加载口径搪塞
  - 虚拟化平台版本不在 Ed12 矩阵内 → 以 TBE043 最新版复核，不按教材矩阵硬答
  - RTR 失败扣减口径争议 → 按 needs-review nr-01 双口径如实说明，监控按保守口径设计
  - 涉及 RLAB 实验环境搭建与节点口令 → 参考 book/overview 环境区背景并标注实验口径，不虚构生产配置
router_entry:
  name: oxe-loading-router
  description: 'OXE 系统装载 能力路由入口：按用户意图分发到 12 张能力卡——SOT 安装、CS 加载、补丁与多版本、虚拟化交付、GAS 交付、云连接、RTR 许可、OPEX 订阅八个 promoted 能力，
    以及分发器模式、SOT 媒体与项目、GAS 运维、Fleet Dashboard 四张 router 能力卡。

    '
