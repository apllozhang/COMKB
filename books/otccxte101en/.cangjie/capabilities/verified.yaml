schema_version: 1
bundle_id: bundle.otcc-standard-advanced
book:
  title: OmniTouch Contact Center Standard Edition - Advanced (Participant's Guide, Edition 07)
  author: ALE Training Services
  source_pack: OTCCXTE101EN.pdf (597 pages)
  baseline_tag: OTCC Standard R10.15 / OXE 11.1 / RLAB
entry:
  name: otcc-standard-advanced
  description: 'OmniTouch Contact Center Standard 高级能力交付与运营支持：网络互助（盲/智能互助、Remote PG 三对象、ABC-F 链路诊断）、 Soft Panel Manager 实时墙板
    （部署三件套与可视化配置）、 CCTA 票据分析、特殊功能开关、 Excel 报表定制、 CCS Server 集中接入，以及 ACR 对象/技能体系与 ISM 匹配排序口径。适用于 OTCC Standard
    高级功能的配置、排障、容量核对与验收问答；ASM 脚本编写深度与 LCA 脚本族由姊妹技能 otcc-standard-advanced-call-routing 承接（见 out_of_scope）。

    '
  core_principles:
  - ACR 呼叫三步走：特征化（CLID/被叫号/呼叫标签/呼叫档案）> ASM 按脚本算坐席列表（动态组）> 呼叫带列表进等待室分配；等待室非 FIFO 且与等待队列同规则互斥
  - ISM 匹配是三级漏斗：强制属性全满足进第 1 子列表 > 重选定时不中逐级降级 > 同级按 Cman 最小、同分比 Copt（缺技能按 9 代入）、再同分按 PLTR/LIT
  - 网络互助的关键是"知道对方状态"：智能互助经 ABC-F 交换 Pilot 状态与真实等待时间；Remote PG 有分布门限+资源选择优先级而无呼叫选择优先级；三级水位=优先级 0-9 > 门限秒数 > MWT 饱和
  - Soft Panel Manager 是独立数据链：RTI Connector 从 CCS 取数推 SPM（Tomcat 9060），统计按需订阅（选用后最多 1 分钟生效），日统计 15 分钟节拍不可更快
  - 运维有完整命令箱：adm_acd（含 -salb/-servccs）、agacd、hybvisu/compvisu、pildstctx/pgctx、acdsup、spadmin，配合 Navigator 与调试器全栈排障
  - 实验环境口径：教材密码、账号、号码、编号仅限实验；容量数字（21 次重选、5 分钟统计刷新、15 秒门限）均为实验观察口径而非调优建议
  out_of_scope:
  - ASM 脚本积木块级开发、LCA_1/2/3 渐进脚本族与调试器完整实操（姊妹技能 otcc-standard-advanced-call-routing 承接）
  - 技能体系设计方法论（域怎么划、权重怎么定、坐席技能怎么评定，原书只教配置）
  - 话务建模与 sizing（Erlang、坐席/中继估算）、监听与录音的法律合规边界（原书零覆盖）
  - RLAB 虚机平台细节与培训评估流程（教学专用基础设施）
  - OXE 组网与 Direct IP Link 的新建规划（书内只给状态诊断与互助行为）
  stop_conditions:
  - 需要 ACR 脚本级深度开发或复杂 LCA 策略 > 明确转姊妹技能 otcc-standard-advanced-call-routing，不在本 bundle 内展开
  - 需要生产容量承诺或话务建模 > 声明书中数值为实验口径与合规红线，指向当期 Feature List 与话务数据
  - 涉及监听/录音上线 > 先过法律合规评审，本 bundle 只覆盖技术开关与行为验证
  - 版本相关判定（CCS Server 15/120、p558 "29 or 120"）> 按 needs-review nr-01 双口径如实说明，以 15/120 与 ">9 强制" 为规划口径
router_entry:
  name: otcc-standard-advanced-router
  description: 'OTCC Standard 高级能力路由入口：按用户意图分发到 12 张能力卡——ISM 匹配、 Remote PG 互助、 SPM 部署、墙板配置、 CCTA 票据、特殊功能、 Excel
    报表、 CCS Server 八个 promoted 能力，以及 ACR 对象、 ASM 脚本主干、 CCS 安装与实验环境、 ACD 维护命令箱四张 router 能力卡。

    '
