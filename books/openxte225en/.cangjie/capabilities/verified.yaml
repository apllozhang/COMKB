schema_version: 1
bundle_id: bundle.ot-mobility-remote-worker
book:
  title: OpenTouch — 移动与远程办公 (Participant's Guide)
  author: ALE Training Services
  source_pack: OPENXTE225EN.pdf (287 pages)
  baseline_tag: OpenTouch Suite R2.6 / OTSBC 7.2 / RLAB
entry:
  name: ot-mobility-remote-worker
  description: 'OpenTouch MLE 移动化与远程工作者交付支持：DMZ 双边缘架构（反代+OTSBC）与 DNS/端口规划、证书策略与自建 CA 签发、OpenTouch 服务器侧远程访问申报（RP/OTSBC/DAS/ACS）、
    OTSBC 部署与向导配置、反向代理两路线（内嵌 RP 与 Nginx）、OTC PC 两模式（multi-devices 与 Nomadic SIP）、OTC 智能手机开通（自动对象与 DISA/ARS 联动）、iPhone+ APNS 推送专项。
    适用于把 OpenTouch 通信服务安全开放到互联网的部署、选型与排障问答；生产容量数值、iPhone 完整手工配置与正式 PKI 流程不在原书范围内（见 out_of_scope）。

    '
  core_principles:
  - 远程接入骨架是 DMZ 双边缘：反代管 HTTPS/Web 服务通道，OTSBC 管 SIP 信令与 RTP/SRTP 媒体；VPN 只是官方标注的技术替代方案
  - 证书是硬前提：远程访问必须 CA 签发，预载"通用证书"（security off）被官方明确反对；会议服务 FQDN 必须进反代与 OT 服务器证书的 SAN
  - DNS 内外分离：同一批 FQDN 内部解析到私网、公共 DNS 解析到反代/SBC 公网 IP；EVS 通知 URL 必须带 8016 端口
  - 客户端侧两步法：接入配置（公共 URL+凭证）加路由档案（从哪拨/路由到哪）；手机发起拨打永远本机发话，dial from 不影响
  - 版本分界：OTSBC 7.2 起可内嵌反代；OT 2.2 起 Nginx 必须 remoteworker.conf 与 conference.conf 同改；R2.6 起远程分机可做用户唯一设备
  - 实验环境口径：教材域名/公网/口令/号码仅限实验，生产全量替换；容量数值（CAC/并发/带宽）全书缺位
  out_of_scope:
  - 容量与体验数值（CAC 阈值、并发用户规模、带宽、游牧池算例）——指向 TC2639、8AL90065USAG 或 ALE sizing 工具
  - iPhone 完整手工配置（书内两处明示 not part of this lab，查 TC2639）与 APNS 证书 2022 后的续期机制
  - 正式 PKI 流程、通配符证书合规性、生产安全基线（口令台账/SBC 加固/防火墙整站策略）
  - 非 OpenTouch 平台与 OTES 旧代方案（OTES 自 OT 2.2 起不再是方案一部分）
  stop_conditions:
  - 需要生产容量数值或 sizing 结论 → 明确指向 TC2639/8AL90065USAG/sizing 工具，不以实验口径搪塞
  - 需要 iPhone 手工配置清单 → 指向 TC2639（TC2341en 辅助），不虚构书内步骤
  - 涉及 VPN 隧道/加密算法等替代方案细节 → 声明书内仅标"技术替代"，转客户网络规范
  - 版本分界判定（OTSBC 7.2、OT 2.2、R2.6）→ 按系统实际版本区分配法，不把新配法套到老系统
router_entry:
  name: ot-mobility-remote-worker-router
  description: 'OpenTouch 移动与远程办公 能力路由入口：按用户意图分发到 12 张能力卡——DMZ 双边缘架构、证书与 PKI、OT 服务器侧设置、OTSBC 部署、反向代理、
    OTC PC 两模式、智能手机开通、iPhone APNS 八个 promoted 能力，以及客户端接入两步法、智能手机连接模式、VMware 虚机部署、实验环境与拨测四张 router 能力卡。

    '
