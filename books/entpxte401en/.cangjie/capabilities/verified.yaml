  title: OmniPCX Enterprise - Advanced (Participant's Guide, Edition 13)
  author: ALE Training Services
  source_pack: ENTPXTE401EN.pdf (543 pages)
  baseline_tag: OmniPCX Enterprise R101.1 MD4 / Advanced Ed13 / RLAB
entry:
  name: oxe-advanced
  description: 'OmniPCX Enterprise 高级部署与运维支持：SSH 免密地基、CS 冗余（本地/空间）与不停机升级、IP 域与 CAC、PCS 域级生存性、公私网双向溢出与重路由、
    Direct IP Link 全 IP 组网、Audit/Broadcast 数据一致性，以及多线监督、经理助理、寻线代接、速拨、办公桌共享、多设备等话机级业务。适用于 OXE 企业级机制的配置、演练、
    排障与行为解释问答；冗余拓扑/域规划等设计决策的话务输入、生产安全基线与 Starter 级前置不在原书范围内（见 out_of_scope）。

    '
  core_principles:
  - 高可用分层各管一段：CS 冗余保呼叫控制（已建立通话跨切换存活）、IP 域+PCS 保远程域断链自治、公私网溢出保电话网退路——三层不可互替
  - SSHv2 公钥免密自 N3 起是协同地基：mastercopy/pcscopy/audit/broadcast 全依赖；oxe-ssh-auth 管一对、oxe-nw-sshkey-sync 以 CSV 管全网
  - 冗余对铁律同版本同类平台；备机失联窗口默认 120 分钟（0-120 可配），超时触发 440 事件只能 mastercopy 整库克隆
  - IP 域按设备初始化时 IP 归属落域且 CS/PCS 必须域 0；CAC 只闸跨域通话数（-1 不限）；PCS 是域级生存性而非热备（30 天上限、库单向同步）
  - Direct IP Link 启用是一次性决策：Disabled→Migrating（必须重启）→Enabled 不可逆；两端带宽/加密/接入数不一致即 2879 拒建
  - Audit 直改表须先模拟+强烈建议备份全网库；Broadcast 默认 10 分钟周期非即时；trunk 组前缀/ARS 表/IP 域等本地对象不广播不审计
  - 实验口径纪律：书中 IP/账号/密码/号码仅限 RLAB；生产化依据指向 My Portal 技术文档与 Starter 教材，容量数字须带标称上限前提
  out_of_scope:
  - Starter 级内容：装机、barring、ARS 基础、GD/OMS SSH 方法、swinst/netadmin 入门（原书多处 REFER TO STARTER TRAINING）
  - 话务模型（Erlang）与带宽计算方法论；15000/100000/1488/10000 呼时等均为标称口径
  - 生产安全基线（证书轮换、口令治理、PKI 管理）与 OmniVista 8770/4645 VM/DECT/SIP 终端装机操作
  - RLAB/SIP 模拟器教学基础设施搭建与培训评估流程
  stop_conditions:
  - 需要冗余拓扑选择、域与编号规划、PCS 布点等设计输入 → 标注书外，指向客户网络设计与 My Portal 技术文档，不以实验口径搪塞
  - Direct IP Link 已 Enabled 想改回 → 如实说明不可逆（只能恢复数据库备份），引导走变更/回滚流程而非尝试改系统选项
  - 引用容量数字做承诺 → 强制带前提（每链/每节点/每系统+标称口径），缺话务模型时明确说明
  - 客户期望 PCS 长期顶班或给无 MG 纯 SIP 域配 PCS → 按 30 天上限与救援边界如实纠偏
router_entry:
  name: oxe-advanced-router
  description: 'OXE Advanced 能力路由入口：按用户意图分发到 12 张能力卡——SSH 免密、CS 冗余、IP 域与 PCS、双向溢出、Direct IP Link、Audit/Broadcast、
    多线监督、组业务与速拨八个 promoted 能力，以及办公桌共享、多设备、实验环境基线、维护命令速查四张 router 能力卡。

    '
