bundle_id: bundle.visual-automated-attendant
book:
  title: Visual Automated Attendant — Installation, Configuration and Maintenance (Participant's Guide, Edition 20)
  author: ALE Training Services
  source_pack: VSAAXTE001EN.pdf (351 pages)
  baseline_tag: VAA R4.8.006 / OXE / RLAB
entry:
  name: visual-automated-attendant
  description: 'VAA（Visual Automated Attendant）软件话务台/IVR 的安装、配置与维护：SUSE 服务器安装（install.sh 参数契约）与 HTTPS 证书、OXE 侧 SIP 五段链对接与接通排障、多租户与三级树设计（UC1-UC3）、提示音与 TTS/ASR 资产、IVR 选项节点（变量/收号/显示名/HTTP/邮件）、
    Master/Slave 高可用与 OXE ARS 切换、日常维护备份升级、外部数据库集成、统计报告。适用于 VAA 交付、配置、排障与方案落地问答；OXE 编号计划原理、生产网络端口与公网证书细节不在原书范围内（见 out_of_scope）。

    '
  core_principles:
  - 双层路由缺一不可：VAA 内 Routing 把 DID 绑到树，OXE 侧经 ABC/F 型 SIP 中继把呼叫送进 VAA；incoming username 双侧一致是接通契约
  - 一切配置在 Web 界面完成且必须 HTTPS（4.6.104 起）；树是拖出来的（12 种原生节点 + 9 种 IVR 选项节点另购许可），每个节点必须命名——名称直接进统计
  - 依赖物先行：日历/营业时间/过滤器/提示音必须在建树之前建好；多语言树的语言选择前提示必须双语同文件
  - 高可用是 VAA 侧复制 + OXE 侧切换：Slave 只读无统计、切换丢进行中呼叫、Master 恢复后必须手工 vaa ha resync
  - 实验环境口径：教材密码、账号与网段仅限实验；规格表与端口清单为示例口径，生产以官方文档为准
  out_of_scope:
  - OXE 编号计划原理与冗余工程实施（ABC-F 语义、呼叫服务器冗余设计；OXE 侧文档体系承载）
  - 端口清单、完整安装步骤、公网证书配置细节（原书外置到 VAA Installation Guide 4.2/6.4 与第 6 章）
  - multi-company 配置细节（TBE083 与 OTEC-S 配置指南）与 OPEX 超配处置行为
  - 非 JDBC 关系库（如 NoSQL）接入、离线/国产化 TTS 替代方案、Teams 等第三方集成（原书未涉及）
  stop_conditions:
  - 端口数超 120 或需跨站点容灾 + OPEX 组合 → 超出书内范围（120 上限找中央售前；空间冗余与 Purple On Demand 互斥），如实声明
  - 需要生产网络端口/证书细节或完整安装步骤 → 指向 VAA Installation Guide 对应章节，不以实验口径搪塞
  - 涉及 RLAB/ITSP1 实验环境搭建 → 参考 book/overview 环境区背景，不虚构生产配置
  - 4.8.006 升级诉求 → 按书内唯一路径回答（全新安装 + 数据库恢复 + Release 11 新许可），不提供原地升级方案
router_entry:
  name: visual-automated-attendant-router
  description: 'VAA 能力路由入口：按用户意图分发到 12 张能力卡——安装对接、多租户树设计、提示音 TTS/ASR、IVR 选项节点、高可用、维护备份、数据库集成、统计报告八个 promoted 能力，
    以及 WebAdmin 管理面、PCS/OPEX 许可、服务器选型虚拟化、架构冗余全景四张 router 能力卡。

    '
promotion_budget: 8
