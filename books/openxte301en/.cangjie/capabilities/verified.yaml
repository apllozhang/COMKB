entry:
  name: opentouch-advanced
  description: 'OpenTouch 与 OXE 高级特性的交付与排障支持：Nomadic 移动与 Ghost Z 资源池、Desksharing、OTC 智能手机（REX/DISA/APNS）、远程接入通道与证书、统一消息（Exchange/O365/Gmail/IMAP）、目录搜索与 Single Business Card、协作会议、日历在场与同步、外部认证（LDAP/RADIUS/Kerberos）。适用于 OpenTouch R2.6.x 时代的配置、选型、排障与方案问答；
    容量算例、非法国号码计划与生产安全加固不在原书范围内（见 out_of_scope）。

    '
  core_principles:
  - 分工：OXE 保留呼叫控制与话机生态，OpenTouch 服务器承载协作、消息、移动性与目录；客户端统一从 OT 拿服务
  - Nomadic 的本质是资源池换轨：每路蜂窝连接占 1 个 Ghost Z、每路 VoIP 连接占 1 个 Ghost Z 加 1 个 SIP 设备，占住直到用户关闭 nomadic——并发数决定池规模
  - 远程接入三件套：数据面走反向代理（443/8016），SIP/媒体走 OTSBC（5261/8061/7000-7499），号码格式靠 DAS 正则串行处理——顺序错一条全盘错；会议 FQDN 必须进两张证书 SAN
  - 统一消息把语音留言变成邮件：四后端能力递减（Exchange 全功能、O365 桌面版、Gmail 限 500 用户、IMAP4 砍四项）；Exchange 侧钥匙是 ICEaccess 特权账号加 Impersonation 加 CA 证书
  - 目录搜索永远查同步库：UDAS 单向同步进 PostgreSQL，同步三参数不设就是空库；合并按权重、Merge keys 至少姓加名、照片 Avatar 优先
  - 外部认证是全局开关：downstream（LDAP/RADIUS 插件）与 upstream（Kerberos）两条路，启用前管理员必须先配好 External login，否则把自己锁在配置工具外面
  - 实验环境口径：教材密码、账号、号码与网段仅限实验；生产必须全部替换并对照最新 release note（版本碎片化 R2.0-R2.6）
  out_of_scope:
  - 容量规划算例（Ghost Z 池、会议端口、DCS 吞吐书内只有"按并发规划"一句话，无算例）
  - 非法国号码计划方法论（DAS/ARS/DID 仅 +33/00/0 口径，他国需自行推导）
  - 高可用、安全加固、企业 IAM 治理细节（ICEaccess 账号治理等仅一句话级提示）
  - Teams/Skype for Business 集成细节、eSIM/5G/MDM、新版浏览器矩阵（2019 年生态，按最新文档重核）
  stop_conditions:
  - 需要生产网络数值或最新兼容矩阵 → 指向 TC2341/TC2391/TC2258/TC2558/TC1623 与最新 release note，不以实验口径搪塞
  - 版本敏感行为（R2.0/R2.2/R2.3.1/R2.6 分界）→ 按章内版本口径回答并提示跨版本核对（needs-review nr-07）
  - LDAP 上限引用 → 按"OXE 侧 5 个"口径并注明 p235/p260 双口径冲突（nr-01），不二选一冒充原文
  - 涉及 RLAB/SIP 模拟器环境搭建 → 参考 book/overview 环境区背景，不虚构生产配置
router_entry:
  name: opentouch-advanced-router
  description: 'OpenTouch Advanced 能力路由入口：按用户意图分发到 13 张能力卡——远程接入、Nomadic、智能手机、统一消息、协作会议、日历同步、目录搜索、外部认证八个 promoted 能力，
    以及 Desksharing、Extended Mobility、DCS 文档、OTC Web 访客、实验 POD 五张 router 能力卡。

    '
