schema_version: 1
bundle_id: bundle.omnivista-directory
book:
  title: OmniVista 8770 — Directory Administration (Participant's Guide, Edition 40)
  author: ALE Training Services
  source_pack: 8770XTE202EN.pdf (565 pages)
  baseline_tag: OmniVista 8770 R5.2 / OXE Purple R101.x / RLAB / Ed40
entry:
  name: omnivista-directory
  description: 'OmniVista 8770 目录（Company Directory）交付与运营支持：OXE 节点注册同步、目录树与 PCX 自动创建、六类链接与改名语义、MSAD/Azure AD 身份管道、保密与访问级别、Click to Call、管理域委派、目录复制、LDIF 批量管道。适用于 8770 R5.2 目录套件的配置、选型、排障与方案落地问答；
    其余套件、网络安全加固与生产凭据不在原书范围内（见 out_of_scope）。

    '
  core_principles:
  - 双存储两棵树：配置目录（o=nmc）与公司目录（o=directoryroot）靠六类链接缝合；主链接是根（1:1、姓名+成本中心一致），姓名/名字只能从公司目录改，配置入口改会断链生成新人
  - 目录供给三通道：PCX 事件自动创建（实时，受全局三开关+节点前提+UID 构造约束）、OXE 同步、LDIF 批量管道（导入只增改不删除，删除靠 PurgeLdap 机制）
  - 保密与权限正交：条目保密四级 × 个人数据五种决定 Web 目录可见性（本人级别不放大他人可见性）；账户访问级别（两应用各五档）在 Security 应用按应用授予
  - Click to Call 五环链：DDI 翻译器 → ISDN 号构造（前缀+实体安装号+话机号）→ 前缀规则 → 属性关联 → STAP 放行；OXE SIP 话机全线不支持
  - 身份管道两通道：MSAD 一条映射+N 条规则（sn 不可删、电话只从 8770 写回、8770 新建/删除不回写 AD）；Azure AD 恒为主节点走 Graph API、不 provision OXE 用户
  - 运营三件：管理域切割可见性与管理权（双许可、默认关闭、本地管理员建不了域）；目录复制 1 主最多 4 从、只冗余目录不冗余服务器、断联超 7 天数据丢失须 LDIF 人工恢复
  - 实验环境口径：教材所有 IP/密码/号码为教学约定值（实验口径），生产必须替换；生产化依据建议以 8770 官方 Installation/Administration Guide 为准（整理侧建议，非原书引用）
  out_of_scope:
  - 性能/计费/报表/设备管理等其余套件（本书仅一页级介绍，需引用对应教材 8770XTE200/201 等）
  - 端口级安全加固与 LDAPS 替代加密方案（目录复制不支持 LDAPS，加密替代在书外）
  - OXE 侧完整命令手册与语音中继/媒体质量问题（本 bundle 仅覆盖注册所需子集）
  - RLAB/SIP 模拟器环境搭建（教学专用基础设施，仅作 Boundary 背景）
  - 培训评估与证书流程（p559-565，非技术内容）
  stop_conditions:
  - 需要生产凭据（adfexc/mtcl/AdminNmc 等）而客户未提供 → 停止使用教材实验值，转客户安全流程
  - PCX 版本配对在 p9 兼容矩阵之外 → 指向官方最新兼容文档核实，不口头承诺
  - 要求复制加密或 8770 整机高可用 → 声明"只冗余目录、LDAPS 不支持"边界，转架构评估
  - 无 IE 环境部署 MSAD 插件 → 按 needs-review nr-06 标记风险，先实测再承诺
  - LDIF 管道出现坏结构（p.conf 根名忘改） → 明确 dirmanag.exe 删 ABS 根的救援路径，禁止盲目重跑 go.bat
router_entry:
  name: omnivista-directory-router
  description: 'OmniVista 8770 目录能力路由入口：按用户意图分发到 12 张能力卡——OXE 注册同步、自动创建、链接改名、MSAD/Azure 管道、Click to Call、保密级别、目录复制、管理域委派八个
    promoted 能力，以及 MSAD 插件、LDIF 工具、客户端与词典定制、平台基础四张 router 能力卡。

    '
