  baseline_tag: OXE R101.2 / EEGW ost 12.02 / OMS oms_16.06 / RLAB
entry:
  name: oxe-native-encryption
  description: 'OXE 加密解决方案（FSNE）的交付与运维支持：证书与信任链全生命周期（PKI 三模式、PKCS#7 五步闭环、CTL/TOFU）、系统参数与 lanpbx.cfg 开通、DTLS/SIP TLS 验证排障与维护闭环、
    SIP TLS 扩展与中继（OTSBC+OXE 双侧）、EEGW/NSP 大容量部署、ABC-F 网络加密、mTLS 双向认证与版本限制处置。适用于 OXE R101.x 信令（DTLS/TLS 1.2/IPSec）与媒体（SRTP）
    加密的配置、选型、排障与验收问答；企业 PKI 运营治理、EEGW VM 规格等生产化数值不在原书范围内（见 out_of_scope）。

    '
  core_principles:
  - 加密由 Call Server 强制执行：NE 开启后 IPMG 与 PCS 一律加密，端点按用户选项逐台加密，trunk/ABC-F 链路两端能力不匹配即退出服务
  - 信任锚是 CTL：端点用 CTL 验证 CS 身份；获取走 lanpbx.cfg 自动推送（首连 TOFU）或手工预置；CA 更新必须立即重生成 lanpbx+重启+重做 PCS 证书
  - 私钥尽量不出端点：PKCS#7 路线（CSR 在实体上生成、外部 CA 只回签证书）是推荐主线；PKCS#12 私钥搬家且 SAN 手工易错，仅端点证书场景
  - 容量分界 1500/15000：内嵌 EGW 承载 1500 并发 DTLS/TLS 会话以内，超出强制 EEGW（每 CS 一台 VM，连带 CS 重启风险）
  - 媒体加密=信令加密×参数叠加：SIP TLS 只管信令，SRTP 要求系统 NE 与网关 RTP/SRTP 参数同时开启；端到端任何一环缺失即明文
  - 实验环境口径：教材密码、账号、网段、许可值仅限实验；所有菜单路径为 netadmin/lanpbxbuild/WBM 导航坐标
  out_of_scope:
  - 企业 PKI 运营治理（CA 私钥保管、CRL/OCSP 基础设施、审批流程）——原书只有概念页，签发环节在客户 CA 规程
  - EEGW VM 的 CPU/内存规格与压测口径（S.O.T. 仅按最大用户数 Sizing）；trunk/EEGW 侧抓包位置与 SIP TLS 解密
  - 真实运营商 TLS 对接参数与 SBC 型号差异（实验用 ITSP2 模拟器与 OTSBC）；SIP TLS with SSM 与 IPv6 场景（不兼容）
  - 课程评估/RLAB 平台运营等教学基础设施操作细节
  stop_conditions:
  - 需要企业 PKI 运营或真实 CA 签发排期 → 明确指向客户 CA 规程，不以实验"秒签"口径搪塞
  - 站点要求 SIP TLS with SSM、IPv6 或第三方 SIP 话机加密 → 原书明确不兼容，声明边界不硬配
  - EEGW VM 规格与容量规划超出"最大用户数"口径 → 指向 OXE 安装文档与压测依据
  - 证书吊销（CRL/OCSP）执行、集中监控/SIEM 集成 → 原书无操作实验，转客户安全方案
router_entry:
  name: oxe-native-encryption-router
  description: 'OXE 加密解决方案能力路由入口：按用户意图分发到 12 张能力卡——证书信任链、加密开通、验证维护、SIP TLS 扩展、SIP trunk、EEGW 部署、ABC-F 网络、mTLS 八个 promoted
    能力，以及 PCS 接管、XCA 工坊、应用生态加密、实验环境四张 router 能力卡。

    '
promotion_budget: 8
