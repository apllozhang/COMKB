schema_version: 1
bundle_id: bundle.omnivista-billing-performance
book:
  title: OmniVista 8770 R5.2 Accounting and Performance Administration (Participant Guide, Edition 45)
  author: ALE Training Services
  source_pack: 8770XTE201EN.pdf (650 pages)
  baseline_tag: OmniVista 8770 R5.2 / OXE R101.1 (lab) / Ed45
entry:
  name: omnivista-billing-performance
  description: 'OmniVista 8770 R5.2 计费与性能管理交付支持：OXE 纳管与票据回收管道、运营商资费建模与成本计算、Code Book 迁移、计费组织树与成本归属、机密控制
    （掩码/解密/可见域）、成本档案、报表生成与定制、VoIP 性能、流量分析与 Tracking 告警、Web Performance 仪表盘、计费归档恢复。适用于 8770 计费与性能的配置、
    排障与交付问答；真实运营商价目、数据库运维与安全凭证治理不在原书范围内（见 out_of_scope）。'
  core_principles:
  - '单向管道：OXE 内存缓冲（≤500 条，满或 90 分钟无新票落盘）经 TAX 文件与 ACCOUNT.LIS，由 8770 对比索引 FTP 增量取回、加载过滤后入库，断点按目录与日志逐段查'
  - '成本在票据加载时算好：运营商配置为 Period 下的 Calendar/Region/Tariff/Direction；配置改动涉及存量必须 Compute cost（Force）重算，否则新旧成本混存'
  - '费率可复算：exact 线性可叠加接通费/免费时长/保底/分段，round 按阶段计，脉冲按票据 Charge units 乘单价；服务费 C+S 须双资费成对绑方向'
  - '组织树决定钱归谁：成本中心从 OXE 同步（cc=255 落根，无成本中心对象落默认成本中心）；分机改归属只能回 OXE 配置；剪贴无历史、复制留灰色条目'
  - '机密三道闸：掩码档案按树继承遮显示（grouped 报表只认 Default 档案）、解密须 Mask data access 组口令、可见域按管理员裁剪；OXE 侧已遮号码 8770 无法还原'
  - '质量与告警有量化口径：VoIP KPI 默认时延大于 150ms、丢包大于 3%、BFI Burst 大于 5%；流量分析仅 OXE 且默认只算三类对象（PtpType ALL 才看被叫与终端）；Tracking 由任务驱动非实时'
  - '数据寿命：计费票 31 天归档成 archZ、再 94 天清理，最长 125 天且按记录日期清理；书内实验口径数值（税率/汇率/密码）一律不进生产'
  out_of_scope:
  - 真实运营商价目数据工程与各国监管费率（书内全用教学数值，法国 SVA 仅示例 ARCEP 口径）
  - MariaDB 容量规划、备份与恢复演练（书内仅 Maintenance 一句带过）
  - SNMPv3 与系统口令的生产治理（书内明文密码均为实验口径）
  - 话务数据法定留存期限与合规结论（125 天是机制上限，GDPR 类合规在书外）
  - 8770 安装、虚机规格与防火墙端口（属安装文档与 Capacity Planning tool）；OXE 维护命令体系（属 OXE 技术文档）
  - RLAB 实验平台搭建与报表练习题面的具体业务数值（教学专用，保留模式替换业务值）
  stop_conditions:
  - 用户要真实价目/税率/汇率的权威数值 → 指向运营商价目与监管文件（如法国 ARCEP），不以教学值搪塞
  - 涉及生产口令、SNMP 凭证治理或留存合规 → 声明书内为实验口径，要求客户提供安全基线与合规口径
  - 多节点组网、PCS 与 OpenTouch 关联同步的生产部署 → 书内只有概念图无实验，声明边界不虚构
  - 数据库容量、备份与恢复演练需求 → 指向 8770 安装文档与数据库运维规范（书外）
  - 版本漂移敏感问题（兼容矩阵/界面/预定义报表清单）→ 按 Ed45 与 R5.2 口径回答并提示重核最新文档
